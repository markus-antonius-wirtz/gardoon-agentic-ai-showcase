[project]
name = "gardoon-agentic-showcase"
version = "1.0.0"
description = "Enterprise Multi-Agent Quant & Compliance Studio built by Gardoon Ltd. (LangGraph + Qdrant Hybrid RAG + FastAPI)"
readme = "../README.md"
requires-python = ">=3.12"
authors = [
    { name = "Gardoon Ltd.", email = "info@gardoon.ltd" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langchain-core>=0.3.30",
    "langchain-google-genai>=2.0.8",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.10",
    "psycopg[binary,pool]>=3.2.3",
    "qdrant-client>=1.12.1",
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 105

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "langgraph.*",
    "langchain_google_genai.*",
    "psycopg.*",
    "psycopg_pool.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
