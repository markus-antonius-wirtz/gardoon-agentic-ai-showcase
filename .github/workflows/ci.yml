name: Enterprise CI — Python Strict, Next.js & Helm Validation

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-quality-and-tests:
    name: Python 3.12 (Ruff + Mypy Strict + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Strict Type Check with Mypy
        run: uv run mypy app tests
      - name: Run Multi-Agent & Hybrid Qdrant Test Suite
        run: uv run pytest -v

  frontend-build:
    name: Next.js 14 TypeScript & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Standalone Next.js Bundle
        run: npm run build

  kubernetes-and-docker-validation:
    name: Kubernetes Helm Lint & Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint Helm Chart
        run: helm lint deploy/helm/gardoon-agent-showcase
      - name: Render Kubernetes Manifests
        run: helm template gardoon deploy/helm/gardoon-agent-showcase > /dev/null
      - name: Validate Docker Compose Topology
        run: |
          cp .env.example .env
          docker compose config > /dev/null
